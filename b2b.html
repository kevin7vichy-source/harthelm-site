<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HARTHELM - 渠道合作 (B2B)</title>
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 200 200'%3E%3Ccircle cx='100' cy='100' r='96' fill='%23ffffff'/%3E%3Cg stroke='%231b2634' stroke-width='11' stroke-linecap='round'%3E%3Cline x1='100' y1='14' x2='100' y2='186'/%3E%3Cline x1='14' y1='100' x2='186' y2='100'/%3E%3Cline x1='39.2' y1='39.2' x2='160.8' y2='160.8'/%3E%3Cline x1='160.8' y1='39.2' x2='39.2' y2='160.8'/%3E%3C/g%3E%3Ccircle cx='100' cy='100' r='70' fill='none' stroke='%231b2634' stroke-width='13'/%3E%3Ccircle cx='100' cy='100' r='44' fill='%23ffffff' stroke='%23a6844e' stroke-width='5'/%3E%3Cpath d='M100 72 L73 94 V122 H92 V109 A8 8 0 0 1 108 109 V122 H127 V94 Z' fill='%23a6844e'/%3E%3C/svg%3E">
    <style>
        :root {
            --navy: #141c2b;
            --navy-light: #1e293b;
            --gold: #b89b72;
            --gold-hover: #d4b88d;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --font-family: 'Helvetica Neue', Helvetica, Arial, 'PingFang SC', 'Microsoft YaHei', sans-serif;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: var(--font-family); background-color: var(--navy); color: var(--text-main); line-height: 1.6; -webkit-font-smoothing: antialiased; }
        a { text-decoration: none; color: inherit; }

        /* 统一顶部导航栏 */
        header {
            padding: 20px 5%;
            background: rgba(20, 28, 43, 0.95);
            backdrop-filter: blur(10px);
            border-bottom: 1px solid rgba(255,255,255,0.05);
            display: flex;
            justify-content: space-between;
            align-items: center;
            position: sticky; top: 0; z-index: 100;
        }
        .logo-text { font-size: 20px; letter-spacing: 4px; font-weight: 600; display: flex; align-items: center; gap: 10px; }
        .logo-text img { height: 30px; }
        .nav-links { display: flex; gap: 30px; font-size: 14px; color: var(--text-muted); align-items: center; }
        .nav-links a { padding: 6px 0; border-bottom: 2px solid transparent; transition: all 0.3s; }
        .nav-links a:hover { color: var(--gold); }
        .nav-links a.active { color: var(--gold); border-bottom-color: var(--gold); }

        /* 页面主体区块 */
        .page-section { padding: 70px 5% 100px; max-width: 1200px; margin: 0 auto; animation: fadeIn 0.5s ease; }
        .section-subtitle { text-align: center; font-size: 22px; margin-bottom: 35px; font-weight: 400; color: var(--text-main); }
        .section-subtitle::after { content: ''; display: block; width: 40px; height: 2px; background: var(--gold); margin: 12px auto 0; }

        /* Hero 区 */
        .hero-b2b { text-align: center; max-width: 800px; margin: 0 auto 60px; }
        .hero-b2b h1 { font-size: 32px; margin-bottom: 20px; color: var(--gold); font-weight: 500; letter-spacing: 1px; }
        .hero-b2b p { font-size: 16px; color: var(--text-muted); }

        /* 痛点与解法区块 */
        .pain-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(320px, 1fr)); gap: 30px; margin-bottom: 70px; }
        .pain-card {
            background: linear-gradient(135deg, var(--navy-light) 0%, rgba(30, 41, 59, 0.4) 100%);
            border-left: 4px solid var(--gold);
            padding: 30px;
            border-radius: 4px;
        }
        .pain-card .question { font-size: 18px; color: var(--text-main); font-weight: 600; margin-bottom: 12px; }
        .pain-card .answer { font-size: 15px; color: var(--gold); }

        /* 合作优势（五大承诺）网格 */
        .feature-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 30px; margin-bottom: 60px; }
        .feature-card { background: var(--navy-light); padding: 35px 30px; border: 1px solid rgba(255,255,255,0.05); transition: all 0.3s; }
        .feature-card:hover { border-color: rgba(184, 155, 114, 0.4); transform: translateY(-3px); }
        .feature-card h3 { color: var(--gold); font-size: 18px; margin-bottom: 15px; font-weight: 500; }
        .feature-card p { font-size: 14px; color: var(--text-muted); }

        /* 按钮 */
        .btn { padding: 14px 36px; font-size: 15px; letter-spacing: 1px; cursor: pointer; transition: all 0.3s; border-radius: 2px; display: inline-block; text-align: center; font-weight: 500; }
        .btn-primary { background-color: var(--gold); color: var(--navy); border: 1px solid var(--gold); }
        .btn-primary:hover { background-color: var(--gold-hover); border-color: var(--gold-hover); transform: translateY(-2px); }

        /* 底部 */
        footer { background: #0b111a; padding: 40px 5% 30px; font-size: 13px; color: var(--text-muted); border-top: 1px solid rgba(255,255,255,0.05); text-align: center; }

        /* 悬浮 WhatsApp */
        .whatsapp-float {
            position: fixed; bottom: 30px; right: 30px; background-color: #25D366; color: white;
            padding: 15px 25px; border-radius: 50px; display: flex; align-items: center; gap: 10px;
            font-weight: bold; box-shadow: 0 4px 15px rgba(37, 211, 102, 0.3); z-index: 1000; transition: transform 0.3s;
        }
        .whatsapp-float:hover { transform: scale(1.05); color: white; }

        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        @media (max-width: 768px) {
            header { flex-direction: column; gap: 15px; }
            .nav-links { gap: 18px; flex-wrap: wrap; justify-content: center; }
            .hero-b2b h1 { font-size: 24px; }
        }
    </style>
</head>
